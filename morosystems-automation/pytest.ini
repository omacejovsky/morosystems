[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --numprocesses auto
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output test-results
    --html reports/report.html
    --self-contained-html
markers =
    gui: GUI tests driven through a real browser
    api: API tests against the todo-be backend
log_level = INFO
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
